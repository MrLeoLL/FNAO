<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Five Nights At Orelha's</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}


/* =========================================================
   MENU PRINCIPAL
========================================================= */

#main-menu {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.92) 0%,
            rgba(0,0,0,.72) 38%,
            rgba(0,0,0,.2) 75%,
            rgba(0,0,0,.25) 100%
        ),
        url("images/menu-bg.jpg")
        center center /
        cover
        no-repeat;
}


/* ESCURECIMENTO */

#main-menu::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.25) 50%,
            rgba(0,0,0,.88) 120%
        );
}


/* SCANLINES */

#main-menu::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .65;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.025) 1px,
            rgba(0,0,0,.12) 2px,
            rgba(0,0,0,.12) 4px
        );

    animation: scanMove 6s linear infinite;
}

@keyframes scanMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(10px);
    }
}


/* =========================================================
   NOISE
========================================================= */

.noise {
    position: absolute;
    inset: -50px;
    opacity: .045;
    pointer-events: none;
    z-index: 2;

    background-image:
        repeating-radial-gradient(
            circle at 30% 30%,
            white 0px,
            transparent 1px,
            transparent 4px
        );

    background-size: 8px 8px;

    animation:
        noiseMove
        .12s
        steps(2)
        infinite;
}

@keyframes noiseMove {
    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(-8px,4px);
    }

    50% {
        transform: translate(6px,-5px);
    }

    75% {
        transform: translate(4px,8px);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =========================================================
   MENU CONTENT
========================================================= */

.menu-content {
    position: absolute;
    z-index: 10;
    left: 7vw;
    top: 50%;
    transform: translateY(-50%);
}


/* =========================================================
   TÍTULO
========================================================= */

.title {
    margin-bottom: 60px;
    text-transform: uppercase;
    line-height: .87;

    filter:
        drop-shadow(
            5px
            5px
            0
            black
        );
}

.title-small {
    display: block;

    font-size:
        clamp(
            25px,
            3vw,
            55px
        );

    font-weight: 300;
    letter-spacing: 9px;
}

.title-big {
    display: block;

    font-size:
        clamp(
            65px,
            8vw,
            150px
        );

    font-weight: 900;
    letter-spacing: -5px;

    animation:
        titleFlicker
        7s
        infinite;
}

@keyframes titleFlicker {
    0%,
    91%,
    93%,
    95%,
    98%,
    100% {
        opacity: 1;
        transform: translateX(0);
    }

    92% {
        opacity: .15;
        transform: translateX(-5px);
    }

    94% {
        opacity: .65;
        transform: translateX(6px);
    }

    97% {
        opacity: .3;
        transform: translateX(-3px);
    }
}


/* =========================================================
   BOTÕES
========================================================= */

.menu-options {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}

.menu-button {
    position: relative;

    border: none;
    outline: none;
    background: transparent;

    color: #d4d4d4;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            22px,
            2vw,
            35px
        );

    font-weight: 500;
    letter-spacing: 2px;

    padding:
        9px
        20px
        9px
        38px;

    cursor: pointer;

    transition:
        color .08s,
        transform .08s,
        text-shadow .08s;
}

.menu-button::before {
    content: ">>";

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    opacity: 0;
    font-weight: bold;
}

.menu-button:hover {
    color: white;

    transform: translateX(10px);

    text-shadow:
        0 0 5px white,
        0 0 13px rgba(255,255,255,.7);
}

.menu-button:hover::before {
    opacity: 1;
}


/* =========================================================
   RODAPÉ
========================================================= */

.version {
    position: absolute;
    z-index: 10;

    bottom: 25px;
    left: 30px;

    color: #707070;

    font-size: 13px;
    letter-spacing: 2px;
}

.copyright {
    position: absolute;
    z-index: 10;

    right: 30px;
    bottom: 25px;

    color: #595959;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================================
   GLITCH
========================================================= */

#glitch {
    position: fixed;
    inset: 0;

    z-index: 50000;

    pointer-events: none;

    opacity: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.32) 0px,
            rgba(255,255,255,.32) 1px,
            transparent 1px,
            transparent 5px
        );
}


/* =========================================================
   NIGHT SCREEN
========================================================= */

#night-screen {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: black;

    z-index: 100;
}

.night-title {
    text-align: center;

    font-size: 42px;
    letter-spacing: 10px;
    font-weight: 400;

    animation:
        nightBlink
        2s
        infinite;
}

@keyframes nightBlink {
    0%,
    94%,
    100% {
        opacity: 1;
    }

    95% {
        opacity: .2;
    }
}


/* =========================================================
   EXTRAS
========================================================= */

#extras-screen {
    position: fixed;
    inset: 0;

    z-index: 150;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: black;
}

#extras-screen h2 {
    font-size: 50px;
    letter-spacing: 8px;
    margin-bottom: 40px;
}

.back-button {
    border: none;
    background: transparent;
    color: white;

    font-size: 25px;
    letter-spacing: 3px;

    cursor: pointer;
}


/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 999999;

    display: none;

    overflow: hidden;
}

#jumpscare-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   JUMPSCARE SHAKE
========================================================= */

.jumpscare-shake {
    animation:
        jumpscareShake
        .055s
        infinite;
}

@keyframes jumpscareShake {
    0% {
        transform: translate(0,0) scale(1.02);
    }

    20% {
        transform: translate(-6px,3px) scale(1.025);
    }

    40% {
        transform: translate(7px,-4px) scale(1.02);
    }

    60% {
        transform: translate(-5px,-5px) scale(1.025);
    }

    80% {
        transform: translate(6px,5px) scale(1.02);
    }

    100% {
        transform: translate(0,0) scale(1.02);
    }
}


/* =========================================================
   FLASH BRANCO
========================================================= */

#jumpscare-flash {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background: white;

    opacity: 0;

    z-index: 3;
}


/* =========================================================
   TELA VERMELHA FINAL
========================================================= */

#jumpscare-red {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #c40000;

    z-index: 1000000;

    display: none;

    pointer-events: none;
}

#jumpscare-red.active {
    display: block;

    animation:
        redPulse
        .08s
        infinite;
}

@keyframes redPulse {
    0% {
        background: #9e0000;
    }

    50% {
        background: #e00000;
    }

    100% {
        background: #b00000;
    }
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 700px) {

    .menu-content {
        left: 7vw;
        top: 55%;
    }

    .title {
        margin-bottom: 35px;
    }

    .title-small {
        letter-spacing: 5px;
    }

    .copyright {
        display: none;
    }

}

</style>

</head>


<body>


<!-- ======================================================
     MENU
====================================================== -->

<div id="main-menu">

    <div class="noise"></div>

    <div class="menu-content">

        <div class="title">

            <span class="title-small">
                Five Nights At
            </span>

            <span class="title-big">
                ORELHA'S
            </span>

        </div>


        <div class="menu-options">

            <button
                class="menu-button"
                onclick="newGame()"
            >
                NEW GAME
            </button>


            <button
                class="menu-button"
                id="continue-button"
                onclick="continueGame()"
            >
                CONTINUE
            </button>


            <button
                class="menu-button"
                onclick="openExtras()"
            >
                EXTRAS
            </button>

        </div>

    </div>


    <div class="version">
        v0.1 ALPHA
    </div>


    <div class="copyright">
        FIVE NIGHTS AT ORELHA'S
    </div>

</div>



<!-- ======================================================
     NIGHT SCREEN
====================================================== -->

<div id="night-screen">

    <div
        class="night-title"
        id="night-title"
    >
        NIGHT 1
    </div>

</div>



<!-- ======================================================
     EXTRAS
====================================================== -->

<div id="extras-screen">

    <h2>
        EXTRAS
    </h2>

    <button
        class="back-button"
        onclick="closeExtras()"
    >
        &lt; BACK
    </button>

</div>



<!-- ======================================================
     JUMPSCARE
====================================================== -->

<div id="jumpscare">

    <img
        id="jumpscare-image"
        src=""
        alt=""
        draggable="false"
    >

    <div id="jumpscare-flash"></div>

</div>



<!-- ======================================================
     TELA VERMELHA
====================================================== -->

<div id="jumpscare-red"></div>



<!-- ======================================================
     ÁUDIO
====================================================== -->

<audio
    id="jumpscare-audio"
    preload="auto"
>
    <source
        src="audio/jumpscare.mp3"
        type="audio/mpeg"
    >
</audio>



<!-- ======================================================
     GLITCH
====================================================== -->

<div id="glitch"></div>



<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const menu =
    document.getElementById(
        "main-menu"
    );

const nightScreen =
    document.getElementById(
        "night-screen"
    );

const nightTitle =
    document.getElementById(
        "night-title"
    );

const extrasScreen =
    document.getElementById(
        "extras-screen"
    );

const continueButton =
    document.getElementById(
        "continue-button"
    );

const glitch =
    document.getElementById(
        "glitch"
    );

const jumpscare =
    document.getElementById(
        "jumpscare"
    );

const jumpscareImage =
    document.getElementById(
        "jumpscare-image"
    );

const jumpscareFlash =
    document.getElementById(
        "jumpscare-flash"
    );

const jumpscareRed =
    document.getElementById(
        "jumpscare-red"
    );

const jumpscareAudio =
    document.getElementById(
        "jumpscare-audio"
    );



/* =========================================================
   SAVE
========================================================= */

let saveData = null;


try {

    saveData =
        JSON.parse(
            localStorage.getItem(
                "fnao-save"
            )
        );

}

catch (error) {

    saveData = null;

}



/* =========================================================
   CONTINUE
========================================================= */

function updateContinueButton() {

    if (!saveData) {

        continueButton.style.opacity =
            ".25";

        continueButton.style.pointerEvents =
            "none";

    }

    else {

        continueButton.style.opacity =
            "1";

        continueButton.style.pointerEvents =
            "auto";

    }

}


updateContinueButton();



/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    saveData = {
        night: 1,
        completed: false
    };


    localStorage.setItem(
        "fnao-save",
        JSON.stringify(saveData)
    );


    updateContinueButton();

    startNight(1);

}



/* =========================================================
   CONTINUE GAME
========================================================= */

function continueGame() {

    if (!saveData) {
        return;
    }


    startNight(
        saveData.night || 1
    );

}



/* =========================================================
   START NIGHT
========================================================= */

function startNight(night) {

    staticFlash();


    setTimeout(() => {

        menu.style.display =
            "none";

        extrasScreen.style.display =
            "none";

        nightScreen.style.display =
            "flex";

        nightTitle.textContent =
            "NIGHT " + night;

    }, 180);

}



/* =========================================================
   EXTRAS
========================================================= */

function openExtras() {

    staticFlash();


    setTimeout(() => {

        menu.style.display =
            "none";

        extrasScreen.style.display =
            "flex";

    }, 120);

}


function closeExtras() {

    staticFlash();


    setTimeout(() => {

        extrasScreen.style.display =
            "none";

        menu.style.display =
            "block";

    }, 120);

}



/* =========================================================
   STATIC FLASH
========================================================= */

function staticFlash() {

    glitch.style.opacity = ".8";


    setTimeout(() => {
        glitch.style.opacity = "0";
    }, 60);


    setTimeout(() => {
        glitch.style.opacity = ".45";
    }, 110);


    setTimeout(() => {
        glitch.style.opacity = "0";
    }, 170);

}



/* =========================================================
   GLITCH ALEATÓRIO
========================================================= */

function randomGlitch() {

    if (
        menu.style.display ===
        "none"
    ) {
        return;
    }


    if (
        Math.random() < .3
    ) {

        glitch.style.opacity =
            Math.random() * .13;


        setTimeout(() => {

            glitch.style.opacity =
                "0";

        }, 35 + Math.random() * 60);

    }

}


setInterval(
    randomGlitch,
    650
);



/* =========================================================
   PARALLAX MENU
========================================================= */

document.addEventListener(
    "mousemove",
    (event) => {

        if (
            menu.style.display ===
            "none"
        ) {
            return;
        }


        const x =
            (
                event.clientX /
                window.innerWidth -
                .5
            ) * 10;


        const y =
            (
                event.clientY /
                window.innerHeight -
                .5
            ) * 6;


        menu.style.backgroundPosition =
            `calc(50% + ${x}px)
             calc(50% + ${y}px)`;

    }
);



/* =========================================================
   CONFIGURAÇÃO DO JUMPSCARE
========================================================= */

const JP_TOTAL_FRAMES = 20;

const JP_FPS = 30;

const JP_TOTAL_DURATION = 2000;

const JP_ANIMATION_DURATION =
    (JP_TOTAL_FRAMES / JP_FPS) * 1000;

const JP_RED_DURATION =
    JP_TOTAL_DURATION -
    JP_ANIMATION_DURATION;



/* =========================================================
   PRÉ-CARREGAR FRAMES
========================================================= */

const jpFrames = [];


for (
    let i = 1;
    i <= JP_TOTAL_FRAMES;
    i++
) {

    const img = new Image();

    img.src =
        `images/ojp${i}.png`;

    jpFrames.push(img);

}



/* =========================================================
   ESTADO
========================================================= */

let jpPlaying = false;

let jpKeyboardBuffer = "";



/* =========================================================
   ATALHO "JP"
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (jpPlaying) {
            return;
        }


        if (
            event.key.length !== 1
        ) {
            return;
        }


        jpKeyboardBuffer +=
            event.key.toLowerCase();


        jpKeyboardBuffer =
            jpKeyboardBuffer.slice(-2);


        if (
            jpKeyboardBuffer === "jp"
        ) {

            jpKeyboardBuffer = "";

            playJumpscare();

        }

    }
);



/* =========================================================
   PLAY JUMPSCARE
========================================================= */

function playJumpscare() {

    if (jpPlaying) {
        return;
    }


    jpPlaying = true;


    /* ESCONDE AS OUTRAS TELAS */

    menu.style.display =
        "none";

    nightScreen.style.display =
        "none";

    extrasScreen.style.display =
        "none";


    /* LIMPA O ESTADO DO VERMELHO */

    jumpscareRed.classList.remove(
        "active"
    );

    jumpscareRed.style.display =
        "none";


    /* PREPARA O JUMPSCARE */

    jumpscare.style.display =
        "block";

    jumpscare.classList.add(
        "jumpscare-shake"
    );


    jumpscareImage.style.display =
        "block";

    jumpscareImage.src =
        "images/ojp1.png";


    /*
        AQUI ESTÁ A CORREÇÃO:

        primeiro o navegador recebe a ordem
        para mostrar o frame 1.

        depois esperamos dois redraws.

        só então o áudio e a contagem
        do jumpscare começam.
    */


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            /* SOM AGORA COMEÇA JUNTO COM O JUMPSCARE VISÍVEL */

            jumpscareAudio.pause();

            jumpscareAudio.currentTime = 0;


            const audioPromise =
                jumpscareAudio.play();


            if (
                audioPromise !== undefined
            ) {

                audioPromise.catch(
                    () => {}
                );

            }


            /* COMEÇA A ANIMAÇÃO */

            startJumpscareAnimation();

        });

    });

}



/* =========================================================
   ANIMAÇÃO DO JUMPSCARE
========================================================= */

function startJumpscareAnimation() {

    let startTime = null;

    let lastFrame = -1;


    const frameDuration =
        1000 / JP_FPS;


    function animate(timestamp) {

        if (
            startTime === null
        ) {

            startTime =
                timestamp;

        }


        const elapsed =
            timestamp -
            startTime;


        const targetFrame =
            Math.floor(
                elapsed /
                frameDuration
            );


        /* =================================================
           TROCA DE FRAME
        ================================================= */

        if (
            targetFrame !== lastFrame &&
            targetFrame < JP_TOTAL_FRAMES
        ) {

            lastFrame =
                targetFrame;


            const frameNumber =
                targetFrame + 1;


            jumpscareImage.src =
                `images/ojp${frameNumber}.png`;


            /* FLASHES NOS FRAMES FINAIS */

            if (
                frameNumber === 16 ||
                frameNumber === 18
            ) {

                flashJumpscare();

            }

        }


        /* =================================================
           CONTINUAR ANIMAÇÃO
        ================================================= */

        if (
            elapsed <
            JP_ANIMATION_DURATION
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            showRedJumpscare();

        }

    }


    requestAnimationFrame(
        animate
    );

}



/* =========================================================
   FLASH DO JUMPSCARE
========================================================= */

function flashJumpscare() {

    jumpscareFlash.style.opacity =
        ".2";


    setTimeout(() => {

        jumpscareFlash.style.opacity =
            "0";

    }, 35);

}



/* =========================================================
   TELA VERMELHA
========================================================= */

function showRedJumpscare() {

    jumpscare.classList.remove(
        "jumpscare-shake"
    );


    jumpscare.style.display =
        "none";


    jumpscareRed.style.display =
        "block";

    jumpscareRed.classList.add(
        "active"
    );


    /*
        20 frames a 30 FPS
        ≈ 0,667 segundos

        tela vermelha:
        ≈ 1,333 segundos

        total:
        ≈ 2 segundos
    */


    setTimeout(() => {

        endJumpscare();

    }, JP_RED_DURATION);

}



/* =========================================================
   FINALIZAR
========================================================= */

function endJumpscare() {

    /* TELA VERMELHA */

    jumpscareRed.classList.remove(
        "active"
    );

    jumpscareRed.style.display =
        "none";


    /* JUMPSCARE */

    jumpscare.style.display =
        "none";

    jumpscare.classList.remove(
        "jumpscare-shake"
    );


    jumpscareImage.src =
        "";

    jumpscareImage.style.display =
        "block";


    /* ÁUDIO */

    jumpscareAudio.pause();

    jumpscareAudio.currentTime =
        0;


    /* VOLTA AO MENU */

    menu.style.display =
        "block";


    jpPlaying =
        false;

}



/* =========================================================
   DEBUG
========================================================= */

console.log(
    "%cFive Nights At Orelha's",
    "font-size:20px;color:white;background:black;padding:10px"
);


console.log(
    "Digite JP para testar o jumpscare."
);


console.log(
    "Jumpscare:",
    JP_ANIMATION_DURATION,
    "ms de animação +",
    JP_RED_DURATION,
    "ms vermelho =",
    JP_TOTAL_DURATION,
    "ms"
);

</script>


</body>

</html>
