<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Five Nights At Orelha's</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   MAIN MENU
========================================================= */

#main-menu {
    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.92) 0%,
            rgba(0,0,0,.72) 38%,
            rgba(0,0,0,.2) 75%,
            rgba(0,0,0,.25) 100%
        ),

        url("images/menu-bg.jpg")
        center center /
        cover
        no-repeat;
}


#main-menu::before {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.25) 50%,
            rgba(0,0,0,.88) 120%
        );
}


#main-menu::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .65;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.025) 1px,
            rgba(0,0,0,.12) 2px,
            rgba(0,0,0,.12) 4px
        );

    animation:
        scanMove
        6s
        linear
        infinite;
}


@keyframes scanMove {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(10px);
    }

}


/* =========================================================
   NOISE
========================================================= */

.noise {
    position: absolute;

    inset: -50px;

    opacity: .045;

    pointer-events: none;

    z-index: 2;

    background-image:
        repeating-radial-gradient(
            circle at 30% 30%,
            white 0px,
            transparent 1px,
            transparent 4px
        );

    background-size:
        8px 8px;

    animation:
        noiseMove
        .12s
        steps(2)
        infinite;
}


@keyframes noiseMove {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(-8px,4px);
    }

    50% {
        transform:
            translate(6px,-5px);
    }

    75% {
        transform:
            translate(4px,8px);
    }

    100% {
        transform:
            translate(0,0);
    }

}


/* =========================================================
   MENU CONTENT
========================================================= */

.menu-content {
    position: absolute;

    z-index: 10;

    left: 7vw;

    top: 50%;

    transform:
        translateY(-50%);
}


/* =========================================================
   TITLE
========================================================= */

.title {
    margin-bottom:
        60px;

    text-transform:
        uppercase;

    line-height:
        .87;

    filter:
        drop-shadow(
            5px
            5px
            0
            black
        );
}


.title-small {
    display: block;

    font-size:
        clamp(
            25px,
            3vw,
            55px
        );

    font-weight:
        300;

    letter-spacing:
        9px;
}


.title-big {
    display: block;

    font-size:
        clamp(
            65px,
            8vw,
            150px
        );

    font-weight:
        900;

    letter-spacing:
        -5px;

    animation:
        titleFlicker
        7s
        infinite;
}


@keyframes titleFlicker {

    0%,
    91%,
    93%,
    95%,
    98%,
    100% {

        opacity: 1;

        transform:
            translateX(0);

    }

    92% {

        opacity: .15;

        transform:
            translateX(-5px);

    }

    94% {

        opacity: .65;

        transform:
            translateX(6px);

    }

    97% {

        opacity: .3;

        transform:
            translateX(-3px);

    }

}


/* =========================================================
   MENU BUTTONS
========================================================= */

.menu-options {
    display: flex;

    flex-direction:
        column;

    align-items:
        flex-start;

    gap:
        6px;
}


.menu-button {
    position: relative;

    border:
        none;

    outline:
        none;

    background:
        transparent;

    color:
        #d4d4d4;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            22px,
            2vw,
            35px
        );

    font-weight:
        500;

    letter-spacing:
        2px;

    padding:
        9px
        20px
        9px
        38px;

    cursor:
        pointer;

    transition:
        color .08s,
        transform .08s,
        text-shadow .08s;
}


.menu-button::before {
    content:
        ">>";

    position:
        absolute;

    left:
        0;

    top:
        50%;

    transform:
        translateY(-50%);

    opacity:
        0;

    font-weight:
        bold;
}


.menu-button:hover {
    color:
        white;

    transform:
        translateX(10px);

    text-shadow:
        0 0 5px white,
        0 0 13px rgba(255,255,255,.7);
}


.menu-button:hover::before {
    opacity:
        1;
}


/* =========================================================
   FOOTER
========================================================= */

.version {
    position:
        absolute;

    z-index:
        10;

    bottom:
        25px;

    left:
        30px;

    color:
        #707070;

    font-size:
        13px;

    letter-spacing:
        2px;
}


.copyright {
    position:
        absolute;

    z-index:
        10;

    right:
        30px;

    bottom:
        25px;

    color:
        #595959;

    font-size:
        12px;

    letter-spacing:
        1px;
}


/* =========================================================
   GLITCH
========================================================= */

#glitch {
    position:
        fixed;

    inset:
        0;

    z-index:
        50000;

    pointer-events:
        none;

    opacity:
        0;

    background:
        repeating-linear-gradient(
            0deg,

            rgba(255,255,255,.32)
            0px,

            rgba(255,255,255,.32)
            1px,

            transparent
            1px,

            transparent
            5px
        );
}


/* =========================================================
   NIGHT SCREEN
========================================================= */

#night-screen {
    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    background:
        black;

    z-index:
        100;
}


.night-title {
    font-size:
        42px;

    letter-spacing:
        10px;

    font-weight:
        400;

    text-align:
        center;
}


/* =========================================================
   EXTRAS
========================================================= */

#extras-screen {
    position:
        fixed;

    inset:
        0;

    z-index:
        150;

    display:
        none;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    background:
        black;
}


#extras-screen h2 {
    font-size:
        50px;

    letter-spacing:
        8px;

    margin-bottom:
        40px;
}


.back-button {
    border:
        none;

    background:
        transparent;

    color:
        white;

    font-size:
        25px;

    letter-spacing:
        3px;

    cursor:
        pointer;
}


/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare {
    position:
        fixed;

    inset:
        0;

    width:
        100vw;

    height:
        100vh;

    background:
        black;

    z-index:
        999999;

    display:
        none;

    overflow:
        hidden;
}


#jumpscare-image {
    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;
}


/* =========================================================
   SHAKE
========================================================= */

.jumpscare-shake {
    animation:
        jumpscareShake
        .05s
        infinite;
}


@keyframes jumpscareShake {

    0% {
        transform:
            translate(0px,0px)
            scale(1.02);
    }

    20% {
        transform:
            translate(-5px,3px)
            scale(1.025);
    }

    40% {
        transform:
            translate(7px,-4px)
            scale(1.02);
    }

    60% {
        transform:
            translate(-6px,-5px)
            scale(1.025);
    }

    80% {
        transform:
            translate(5px,4px)
            scale(1.02);
    }

    100% {
        transform:
            translate(0px,0px)
            scale(1.02);
    }

}


/* =========================================================
   JUMPSCARE FLASH
========================================================= */

#jumpscare-flash {
    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    background:
        white;

    opacity:
        0;

    pointer-events:
        none;
}


/* =========================================================
   RED SCREEN
========================================================= */

#jumpscare-red {
    position:
        fixed;

    inset:
        0;

    z-index:
        1000000;

    display:
        none;

    background:
        #b00000;

    pointer-events:
        none;
}


#jumpscare-red.active {
    display:
        block;

    animation:
        redPulse
        .08s
        infinite;
}


@keyframes redPulse {

    0% {
        background:
            #930000;
    }

    50% {
        background:
            #df0000;
    }

    100% {
        background:
            #a80000;
    }

}


/* =========================================================
   GAME OVER SCREEN
========================================================= */

#gameover-screen {
    position:
        fixed;

    inset:
        0;

    width:
        100vw;

    height:
        100vh;

    display:
        none;

    z-index:
        2000000;

    overflow:
        hidden;

    background:
        #000;
}


/* Actual gameover image */

#gameover-background {
    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    pointer-events:
        none;
}


/* dark overlay to make buttons readable */

#gameover-screen::before {
    content:
        "";

    position:
        absolute;

    inset:
        0;

    z-index:
        2;

    pointer-events:
        none;

    background:
        radial-gradient(
            circle at 75% 70%,
            rgba(0,0,0,.05),
            rgba(0,0,0,.18) 40%,
            rgba(0,0,0,.3)
        );
}


/* VHS scanlines */

#gameover-screen::after {
    content:
        "";

    position:
        absolute;

    inset:
        0;

    z-index:
        3;

    pointer-events:
        none;

    opacity:
        .3;

    background:
        repeating-linear-gradient(
            0deg,

            transparent 0px,

            transparent 2px,

            rgba(0,0,0,.45) 3px,

            rgba(0,0,0,.45) 4px
        );
}


/* =========================================================
   GAME OVER BUTTON AREA
========================================================= */

.gameover-options {
    position:
        absolute;

    z-index:
        10;

    /*
       Positioned on right side,
       under GAME OVER text.
    */

    left:
        68%;

    top:
        71%;

    transform:
        translate(-50%, -50%);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        flex-start;

    gap:
        10px;
}


.gameover-button {
    position:
        relative;

    border:
        none;

    outline:
        none;

    background:
        transparent;

    color:
        rgba(255,255,255,.65);

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            17px,
            1.6vw,
            28px
        );

    font-weight:
        bold;

    letter-spacing:
        2px;

    padding:
        6px
        10px
        6px
        35px;

    cursor:
        pointer;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.2);

    transition:
        color .08s,
        transform .08s,
        text-shadow .08s;
}


.gameover-button::before {
    content:
        ">";

    position:
        absolute;

    left:
        8px;

    top:
        50%;

    transform:
        translateY(-50%);

    opacity:
        0;
}


.gameover-button:hover {
    color:
        white;

    transform:
        translateX(8px);

    text-shadow:
        0 0 5px white,
        0 0 15px rgba(255,255,255,.8);
}


.gameover-button:hover::before {
    opacity:
        1;
}


/* =========================================================
   GAMEOVER GLITCH
========================================================= */

.gameover-glitch {
    animation:
        gameoverGlitch
        4s
        infinite;
}


@keyframes gameoverGlitch {

    0%,
    94%,
    100% {

        transform:
            translate(0,0);

        filter:
            none;
    }

    95% {

        transform:
            translate(-3px,1px);

        filter:
            contrast(1.4)
            brightness(1.1);
    }

    96% {

        transform:
            translate(5px,-2px);

        filter:
            contrast(1.7);
    }

    97% {

        transform:
            translate(-2px,2px);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .menu-content {
        left:
            7vw;

        top:
            55%;
    }


    .title {
        margin-bottom:
            35px;
    }


    .title-small {
        letter-spacing:
            5px;
    }


    .copyright {
        display:
            none;
    }


    .gameover-options {

        left:
            70%;

        top:
            75%;

    }

}


/* =========================================================
   CONTROLS + GAMEPLAY
========================================================= */
#controls-screen {
    position: fixed; inset: 0; z-index: 180; display: none;
    align-items: center; justify-content: center; background: #000;
}
.controls-panel {
    width: min(680px, 88vw); text-align: center; font-family: "Courier New", monospace;
}
.controls-panel h2 { font-size: clamp(32px,5vw,58px); letter-spacing: 7px; margin-bottom: 38px; }
.control-row { display:flex; justify-content:space-between; border-bottom:1px solid #333; padding:15px 5px; font-size:clamp(16px,2vw,23px); letter-spacing:2px; }
.control-key { font-weight:bold; color:#fff; }
.controls-warning { margin:30px 0; color:#aaa; line-height:1.8; letter-spacing:2px; }
.controls-confirm { border:1px solid #777; background:#080808; color:white; padding:13px 24px; font:18px "Courier New",monospace; letter-spacing:3px; cursor:pointer; }
.controls-confirm:hover { background:#fff; color:#000; }

#game-screen {
    position: fixed; inset:0; z-index:90; display:none; overflow:hidden; background:#000;
}
#game-view {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scale(1.015); opacity:1;
    transition: opacity .18s ease, transform .38s cubic-bezier(.2,.7,.2,1);
}
#game-screen.turning #game-view { opacity:.38; transform:scale(1.035) translateX(-1.5%); }
#game-screen.turning-left #game-view { opacity:.38; transform:scale(1.035) translateX(1.5%); }

.turn-zone {
    position:absolute; top:0; bottom:0; width:90px; z-index:15;
    display:flex; align-items:center; font-size:64px; color:rgba(255,255,255,.28);
    text-shadow:0 0 14px #000; cursor:pointer; transition:color .2s;
}
.turn-zone:hover { color:rgba(255,255,255,.85); }
#turn-left { left:0; justify-content:flex-start; padding-left:18px; display:none; }
#turn-right { right:0; justify-content:flex-end; padding-right:18px; }
.game-hud { position:absolute; inset:0; z-index:12; pointer-events:none; font-family:"Courier New",monospace; text-shadow:2px 2px 3px #000; }
.hud-top { position:absolute; right:30px; top:24px; text-align:right; font-size:23px; font-weight:bold; line-height:1.45; }
.hud-bottom { position:absolute; left:28px; bottom:24px; font-size:19px; line-height:1.55; }
#noise-meter { letter-spacing:2px; }
#flashlight-overlay {
    position:absolute; inset:0; z-index:8; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 48%, rgba(255,255,220,.12) 0%, rgba(255,255,210,.05) 22%, rgba(0,0,0,.02) 40%, rgba(0,0,0,.42) 72%);
    transition:opacity .06s;
}
#flashlight-overlay.on { opacity:1; }

</style>

</head>


<body>


<!-- ======================================================
     MAIN MENU
====================================================== -->

<div id="main-menu">

    <div class="noise"></div>


    <div class="menu-content">

        <div class="title">

            <span class="title-small">
                Five Nights At
            </span>

            <span class="title-big">
                ORELHA'S
            </span>

        </div>


        <div class="menu-options">

            <button
                class="menu-button"
                onclick="newGame()"
            >
                NEW GAME
            </button>


            <button
                class="menu-button"
                id="continue-button"
                onclick="continueGame()"
            >
                CONTINUE
            </button>


            <button
                class="menu-button"
                onclick="openExtras()"
            >
                EXTRAS
            </button>

        </div>

    </div>


    <div class="version">
        v0.1 ALPHA
    </div>


    <div class="copyright">
        FIVE NIGHTS AT ORELHA'S
    </div>

</div>



<!-- ======================================================
     NIGHT SCREEN
====================================================== -->

<div id="night-screen">

    <div
        class="night-title"
        id="night-title"
    >
        NIGHT 1
    </div>

</div>



<!-- ======================================================
     EXTRAS
====================================================== -->

<div id="extras-screen">

    <h2>
        EXTRAS
    </h2>

    <button
        class="back-button"
        onclick="closeExtras()"
    >
        &lt; BACK
    </button>

</div>




<!-- ======================================================
     FIRST-TIME CONTROLS
====================================================== -->
<div id="controls-screen">
    <div class="controls-panel">
        <h2>HOW TO SURVIVE</h2>
        <div class="control-row"><span class="control-key">D</span><span>OPEN / CLOSE DOOR</span></div>
        <div class="control-row"><span class="control-key">SPACE</span><span>FLASHLIGHT</span></div>
        <div class="control-row"><span class="control-key">S</span><span>SECURITY CAMERAS</span></div>
        <div class="controls-warning">Watch your power.<br>Listen carefully.</div>
        <button class="controls-confirm" onclick="confirmControls()">I UNDERSTAND</button>
    </div>
</div>

<!-- ======================================================
     GAME
====================================================== -->
<div id="game-screen">
    <img id="game-view" src="images/office.png" alt="" draggable="false">
    <div id="flashlight-overlay"></div>
    <div class="game-hud">
        <div class="hud-top"><div id="game-time">12 AM</div><div id="game-night">Night 1</div></div>
        <div class="hud-bottom">
            <div>Power: <span id="power-value">100</span>%</div>
            <div>Noise: <span id="noise-meter">▮□□□□</span></div>
        </div>
    </div>
    <div id="turn-left" class="turn-zone">‹</div>
    <div id="turn-right" class="turn-zone">›</div>
</div>


<!-- ======================================================
     JUMPSCARE
====================================================== -->

<div id="jumpscare">

    <img
        id="jumpscare-image"
        src=""
        alt=""
        draggable="false"
    >

    <div id="jumpscare-flash"></div>

</div>



<!-- ======================================================
     RED SCREEN
====================================================== -->

<div id="jumpscare-red"></div>



<!-- ======================================================
     GAME OVER
====================================================== -->

<div id="gameover-screen">

    <img
        id="gameover-background"
        class="gameover-glitch"
        src="images/gameover.png"
        alt=""
        draggable="false"
    >


    <div class="gameover-options">

        <button
            class="gameover-button"
            onclick="tryAgain()"
        >
            TRY AGAIN
        </button>


        <button
            class="gameover-button"
            onclick="backToMenu()"
        >
            BACK TO MENU
        </button>

    </div>

</div>



<!-- ======================================================
     AUDIO
====================================================== -->

<audio
    id="jumpscare-audio"
    src="audio/jumpscare.mp3"
    preload="auto"
></audio>



<!-- ======================================================
     GLITCH
====================================================== -->

<div id="glitch"></div>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const menu =
    document.getElementById(
        "main-menu"
    );

const nightScreen =
    document.getElementById(
        "night-screen"
    );

const nightTitle =
    document.getElementById(
        "night-title"
    );

const extrasScreen =
    document.getElementById(
        "extras-screen"
    );

const continueButton =
    document.getElementById(
        "continue-button"
    );

const glitch =
    document.getElementById(
        "glitch"
    );

const jumpscare =
    document.getElementById(
        "jumpscare"
    );

const jumpscareImage =
    document.getElementById(
        "jumpscare-image"
    );

const jumpscareFlash =
    document.getElementById(
        "jumpscare-flash"
    );

const jumpscareRed =
    document.getElementById(
        "jumpscare-red"
    );

const jumpscareAudio =
    document.getElementById(
        "jumpscare-audio"
    );

const gameoverScreen =
    document.getElementById(
        "gameover-screen"
    );

const controlsScreen = document.getElementById("controls-screen");
const gameScreen = document.getElementById("game-screen");
const gameView = document.getElementById("game-view");
const turnLeft = document.getElementById("turn-left");
const turnRight = document.getElementById("turn-right");
const flashlightOverlay = document.getElementById("flashlight-overlay");
const powerValue = document.getElementById("power-value");
const noiseMeter = document.getElementById("noise-meter");
const gameTime = document.getElementById("game-time");
const gameNight = document.getElementById("game-night");

let currentView = "office";
let doorClosed = false;
let turning = false;
let currentNight = 1;
let power = 100;
let flashlightOn = false;
let gameActive = false;
let nightTimer = null;
let powerTimer = null;
let gameMinutes = 0;




/* =========================================================
   SAVE DATA
========================================================= */

let saveData = null;


try {

    saveData =
        JSON.parse(
            localStorage.getItem(
                "fnao-save"
            )
        );

}

catch (error) {

    saveData =
        null;

}



function updateContinueButton() {

    if (!saveData) {

        continueButton.style.opacity =
            ".25";

        continueButton.style.pointerEvents =
            "none";

    }

    else {

        continueButton.style.opacity =
            "1";

        continueButton.style.pointerEvents =
            "auto";

    }

}


updateContinueButton();



/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    saveData = {

        night:
            1,

        completed:
            false

    };


    localStorage.setItem(

        "fnao-save",

        JSON.stringify(
            saveData
        )

    );


    updateContinueButton();


    if (localStorage.getItem("fnao-controls-seen") === "true") {
        startNight(1);
    } else {
        showControls();
    }

}



/* =========================================================
   CONTINUE
========================================================= */

function continueGame() {

    if (!saveData) {

        return;

    }


    startNight(

        saveData.night || 1

    );

}



/* =========================================================
   START NIGHT
========================================================= */

function showControls() {
    staticFlash();
    setTimeout(() => {
        menu.style.display = "none";
        extrasScreen.style.display = "none";
        controlsScreen.style.display = "flex";
    }, 180);
}

function confirmControls() {
    localStorage.setItem("fnao-controls-seen", "true");
    controlsScreen.style.display = "none";
    startNight(1);
}

function startNight(night) {
    currentNight = night;
    gameActive = false;
    staticFlash();
    setTimeout(() => {
        menu.style.display = "none";
        extrasScreen.style.display = "none";
        controlsScreen.style.display = "none";
        gameScreen.style.display = "none";
        gameoverScreen.style.display = "none";
        nightScreen.style.display = "flex";
        nightTitle.textContent = "NIGHT " + night;

        setTimeout(() => {
            nightScreen.style.display = "none";
            beginGameplay(night);
        }, 1700);
    }, 180);
}

function beginGameplay(night) {
    currentView = "office";
    doorClosed = false;
    power = 100;
    gameMinutes = 0;
    gameActive = true;
    gameView.src = "images/office.png";
    gameNight.textContent = "Night " + night;
    gameTime.textContent = "12 AM";
    powerValue.textContent = "100";
    updateTurnZones();
    gameScreen.style.display = "block";

    clearInterval(nightTimer);
    clearInterval(powerTimer);

    // Temporary alpha timing: one in-game hour every 60 seconds.
    nightTimer = setInterval(() => {
        if (!gameActive) return;
        gameMinutes++;
        const hourIndex = Math.floor(gameMinutes / 60);
        const hour = hourIndex === 0 ? 12 : hourIndex;
        gameTime.textContent = hour + " AM";
    }, 1000);

    powerTimer = setInterval(() => {
        if (!gameActive || power <= 0) return;
        let drain = 0.015;
        if (doorClosed) drain += 0.025;
        if (flashlightOn) drain += 0.035;
        power = Math.max(0, power - drain);
        powerValue.textContent = Math.ceil(power);
    }, 1000);
}

function updateGameImage() {
    if (currentView === "office") {
        gameView.src = "images/office.png";
    } else {
        gameView.src = doorClosed ? "images/door_closed.png" : "images/door_open.png";
    }
    updateTurnZones();
}

function updateTurnZones() {
    turnLeft.style.display = currentView === "door" ? "flex" : "none";
    turnRight.style.display = currentView === "office" ? "flex" : "none";
}

function turnTo(view) {
    if (!gameActive || turning || currentView === view) return;
    turning = true;
    const goingLeft = view === "office";
    gameScreen.classList.add(goingLeft ? "turning-left" : "turning");

    setTimeout(() => {
        currentView = view;
        updateGameImage();
        gameScreen.classList.remove("turning", "turning-left");
        setTimeout(() => turning = false, 400);
    }, 220);
}

turnRight.addEventListener("mouseenter", () => turnTo("door"));
turnLeft.addEventListener("mouseenter", () => turnTo("office"));

function toggleDoor() {
    if (!gameActive || power <= 0) return;
    doorClosed = !doorClosed;
    if (currentView === "door") updateGameImage();
    setNoise(doorClosed ? 4 : 3);
}

function setNoise(level) {
    const n = Math.max(0, Math.min(5, level));
    noiseMeter.textContent = "▮".repeat(n) + "□".repeat(5 - n);
    setTimeout(() => {
        if (gameActive) noiseMeter.textContent = "▮□□□□";
    }, 650);
}

function setFlashlight(on) {
    if (!gameActive || power <= 0) on = false;
    flashlightOn = on;
    flashlightOverlay.classList.toggle("on", on);
    if (on) setNoise(2);
}

document.addEventListener("keydown", event => {
    if (!gameActive || jpPlaying) return;
    if (event.code === "KeyD" && !event.repeat) toggleDoor();
    if (event.code === "Space") {
        event.preventDefault();
        setFlashlight(true);
    }
    if (event.code === "KeyS" && !event.repeat) {
        // Camera system will be added next.
        setNoise(2);
    }
});

document.addEventListener("keyup", event => {
    if (event.code === "Space") setFlashlight(false);
});


/* =========================================================
   EXTRAS
========================================================= */

function openExtras() {

    staticFlash();


    setTimeout(() => {

        menu.style.display =
            "none";

        extrasScreen.style.display =
            "flex";

    }, 120);

}



function closeExtras() {

    staticFlash();


    setTimeout(() => {

        extrasScreen.style.display =
            "none";

        menu.style.display =
            "block";

    }, 120);

}



/* =========================================================
   STATIC
========================================================= */

function staticFlash() {

    glitch.style.opacity =
        ".8";


    setTimeout(() => {

        glitch.style.opacity =
            "0";

    }, 60);


    setTimeout(() => {

        glitch.style.opacity =
            ".45";

    }, 110);


    setTimeout(() => {

        glitch.style.opacity =
            "0";

    }, 170);

}



/* =========================================================
   RANDOM MENU GLITCH
========================================================= */

setInterval(() => {

    if (
        menu.style.display ===
        "none"
    ) {

        return;

    }


    if (
        Math.random() <
        .3
    ) {

        glitch.style.opacity =
            Math.random() * .13;


        setTimeout(() => {

            glitch.style.opacity =
                "0";

        }, 40);

    }

}, 650);



/* =========================================================
   MENU PARALLAX
========================================================= */

document.addEventListener(

    "mousemove",

    event => {

        if (
            menu.style.display ===
            "none"
        ) {

            return;

        }


        const x =

            (
                event.clientX /
                window.innerWidth -
                .5
            )
            *
            10;


        const y =

            (
                event.clientY /
                window.innerHeight -
                .5
            )
            *
            6;


        menu.style.backgroundPosition =

            `calc(50% + ${x}px)
             calc(50% + ${y}px)`;

    }

);



/* =========================================================
   JUMPSCARE SETTINGS
========================================================= */

const JP_TOTAL_FRAMES =
    20;


const JP_FPS =
    30;


const JP_FRAME_DURATION =
    1000 /
    JP_FPS;


/*

The first frame appears,
then audio begins after 80ms.

*/

const JP_SOUND_DELAY =
    80;


/*

20 frames / 30 FPS
≈ 0.667 seconds.

*/

const JP_ANIMATION_TIME =

    (
        JP_TOTAL_FRAMES /
        JP_FPS
    )
    *
    1000;


/*

Total jumpscare sound:
2 seconds.

*/

const JP_TOTAL_TIME =
    2000;


/*

Red screen fills the
remaining time.

*/

const JP_RED_TIME =

    JP_TOTAL_TIME -
    JP_ANIMATION_TIME;



/* =========================================================
   PRELOAD JUMPSCARE FRAMES
========================================================= */

const jpFrames =
    [];


for (
    let i = 1;
    i <= JP_TOTAL_FRAMES;
    i++
) {

    const img =
        new Image();


    img.src =
        `images/ojp${i}.png`;


    jpFrames.push(
        img
    );

}



/* =========================================================
   PRELOAD GAME OVER IMAGE
========================================================= */

const gameoverPreload =
    new Image();


gameoverPreload.src =
    "images/gameover.png";



/* =========================================================
   JUMPSCARE STATE
========================================================= */

let jpPlaying =
    false;


let keyboardBuffer =
    "";



/* =========================================================
   JP TEST SHORTCUT
========================================================= */

document.addEventListener(

    "keydown",

    event => {

        if (
            jpPlaying
        ) {

            return;

        }


        if (
            event.key.length !==
            1
        ) {

            return;

        }


        keyboardBuffer +=

            event.key
            .toLowerCase();


        keyboardBuffer =

            keyboardBuffer
            .slice(-2);


        if (
            keyboardBuffer ===
            "jp"
        ) {

            keyboardBuffer =
                "";

            playJumpscare();

        }

    }

);



/* =========================================================
   PLAY JUMPSCARE
========================================================= */

function playJumpscare() {

    if (
        jpPlaying
    ) {

        return;

    }


    jpPlaying =
        true;



    /* =====================================================
       AUDIO UNLOCK
    ===================================================== */

    jumpscareAudio.pause();


    jumpscareAudio.currentTime =
        0;


    jumpscareAudio.volume =
        0;


    const audioPromise =
        jumpscareAudio.play();


    if (
        audioPromise !==
        undefined
    ) {

        audioPromise.catch(
            error => {

                console.log(
                    "Audio error:",
                    error
                );

            }
        );

    }



    /* =====================================================
       HIDE EVERYTHING
    ===================================================== */

    menu.style.display =
        "none";


    nightScreen.style.display =
        "none";


    extrasScreen.style.display =
        "none";


    gameoverScreen.style.display =
        "none";

    gameScreen.style.display = "none";
    controlsScreen.style.display = "none";
    gameActive = false;
    clearInterval(nightTimer);
    clearInterval(powerTimer);



    /* =====================================================
       FIRST FRAME
    ===================================================== */

    jumpscareImage.src =
        "images/ojp1.png";


    jumpscare.style.display =
        "block";


    jumpscare.classList.add(
        "jumpscare-shake"
    );



    /* =====================================================
       DELAY BEFORE SOUND
    ===================================================== */

    setTimeout(() => {

        jumpscareAudio.currentTime =
            0;


        jumpscareAudio.volume =
            1;


        startJumpscareFrames();

    }, JP_SOUND_DELAY);

}



/* =========================================================
   FRAME ANIMATION
========================================================= */

function startJumpscareFrames() {

    const start =
        performance.now();


    let lastFrame =
        0;



    function animate(
        now
    ) {

        const elapsed =

            now -
            start;


        const frameIndex =

            Math.floor(
                elapsed /
                JP_FRAME_DURATION
            );



        if (

            frameIndex !==
            lastFrame

            &&

            frameIndex <
            JP_TOTAL_FRAMES

        ) {

            lastFrame =
                frameIndex;


            jumpscareImage.src =

                `images/ojp${frameIndex + 1}.png`;


            const visibleFrame =

                frameIndex +
                1;


            if (
                visibleFrame === 16 ||
                visibleFrame === 18
            ) {

                flashJumpscare();

            }

        }



        if (
            elapsed <
            JP_ANIMATION_TIME
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            showRedScreen();

        }

    }


    requestAnimationFrame(
        animate
    );

}



/* =========================================================
   JUMPSCARE FLASH
========================================================= */

function flashJumpscare() {

    jumpscareFlash.style.opacity =
        ".2";


    setTimeout(() => {

        jumpscareFlash.style.opacity =
            "0";

    }, 35);

}



/* =========================================================
   RED SCREEN
========================================================= */

function showRedScreen() {

    jumpscare.classList.remove(
        "jumpscare-shake"
    );


    jumpscare.style.display =
        "none";


    jumpscareRed.style.display =
        "block";


    jumpscareRed.classList.add(
        "active"
    );


    setTimeout(() => {

        endJumpscare();

    }, JP_RED_TIME);

}



/* =========================================================
   END JUMPSCARE
========================================================= */

function endJumpscare() {

    jumpscareRed.classList.remove(
        "active"
    );


    jumpscareRed.style.display =
        "none";


    jumpscare.style.display =
        "none";


    jumpscareAudio.pause();


    jumpscareAudio.currentTime =
        0;


    jumpscareAudio.volume =
        1;


    jumpscareImage.src =
        "";


    jpPlaying =
        false;


    /*
       Instead of returning to menu,
       show Game Over.
    */

    showGameOver();

}



/* =========================================================
   GAME OVER
========================================================= */

function showGameOver() {

    menu.style.display =
        "none";


    nightScreen.style.display =
        "none";


    extrasScreen.style.display =
        "none";


    gameoverScreen.style.display =
        "block";

}



/* =========================================================
   TRY AGAIN
========================================================= */

function tryAgain() {

    gameoverScreen.style.display =
        "none";


    staticFlash();


    const currentNight =

        saveData?.night ||
        1;


    setTimeout(() => {

        startNight(
            currentNight
        );

    }, 150);

}



/* =========================================================
   BACK TO MENU
========================================================= */

function backToMenu() {

    gameoverScreen.style.display =
        "none";


    nightScreen.style.display =
        "none";


    extrasScreen.style.display =
        "none";


    menu.style.display =
        "block";


    staticFlash();

}



/* =========================================================
   DEBUG
========================================================= */

console.log(
    "Five Nights At Orelha's loaded."
);


console.log(
    "Type JP to test the jumpscare."
);

</script>
